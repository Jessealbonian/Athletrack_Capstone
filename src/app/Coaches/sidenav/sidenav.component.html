<!-- Desktop sidebar -->
<aside [class.w-64]="isNavOpen"
       [class.w-20]="!isNavOpen"
       class="hidden lg:flex fixed top-14 left-0 h-[calc(100vh-3.5rem)] border-r bg-white transform translate-x-0
              transition-all duration-300 ease-in-out z-40 flex-col">
  
  <button 
    (click)="toggleNav()"
    [class.left-56]="isNavOpen"
    [class.left-16]="!isNavOpen"
    class="absolute top-4 p-3 rounded-lg hover:bg-indigo-300 bg-white shadow-md transition-all duration-300">
    <svg *ngIf="isNavOpen" xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
    </svg>
    <svg *ngIf="!isNavOpen" xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
    </svg>
  </button>

  <nav class="space-y-1 p-4 mt-4">
    <a routerLink="/home" [routerLinkActive]="['bg-indigo-200', 'text-gray-900']" class="flex items-center gap-3 rounded-lg px-3 py-2 text-gray-500 hover:bg-indigo-200 hover:text-gray-900">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-9 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM4 13a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H5a1 1 0 01-1-1v-6zM16 13a1 1 0 011-1h2a1 1 0 011 1v6a1 1 0 01-1 1h-2a1 1 0 01-1-1v-6z" />
      </svg>
      <span [class.hidden]="!isNavOpen">Dashboard</span>
    </a>

    <a routerLink="/Class" [routerLinkActive]="['bg-indigo-200', 'text-gray-900']" class="flex items-center gap-3 rounded-lg px-3 py-2 text-gray-500 hover:bg-indigo-200 hover:text-gray-900">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-9 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z" />
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" />
      </svg>
      <span [class.hidden]="!isNavOpen">Class</span>
    </a>

    <a routerLink="/routinehistory" [routerLinkActive]="['bg-indigo-200', 'text-gray-900']" class="flex items-center gap-3 rounded-lg px-3 py-2 text-gray-500 hover:bg-indigo-200 hover:text-gray-900">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-9 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
      </svg>
      <span [class.hidden]="!isNavOpen">Routine History</span>
    </a>
  </nav>
</aside>

<!-- Mobile bottom navigation (Athletrack coach palette) -->
<nav class="lg:hidden fixed bottom-0 left-0 right-0 z-50 border-t border-[#0A7664]/30 bg-white shadow-[0_-4px_14px_rgba(2,47,17,0.12)] flex justify-around items-stretch pt-1 pb-[max(0.5rem,env(safe-area-inset-bottom))] px-1">
  <a routerLink="/home"
     routerLinkActive
     #rlaHome="routerLinkActive"
     [routerLinkActiveOptions]="{ exact: true }"
     [class]="rlaHome.isActive ? 'flex flex-1 flex-col items-center justify-center gap-0.5 py-2 rounded-t-lg bg-[#E8F5F0] text-[#022F11]' : 'flex flex-1 flex-col items-center justify-center gap-0.5 py-2 text-gray-500'">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM4 13a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H5a1 1 0 01-1-1v-6zM16 13a1 1 0 011-1h2a1 1 0 011 1v6a1 1 0 01-1 1h-2a1 1 0 01-1-1v-6z" />
    </svg>
    <span class="text-[10px] font-semibold leading-tight">Dashboard</span>
  </a>
  <a routerLink="/Class"
     routerLinkActive
     #rlaClass="routerLinkActive"
     [class]="rlaClass.isActive ? 'flex flex-1 flex-col items-center justify-center gap-0.5 py-2 rounded-t-lg bg-[#E8F5F0] text-[#022F11]' : 'flex flex-1 flex-col items-center justify-center gap-0.5 py-2 text-gray-500'">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z" />
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" />
    </svg>
    <span class="text-[10px] font-semibold leading-tight">Class</span>
  </a>
  <a routerLink="/routinehistory"
     routerLinkActive
     #rlaRh="routerLinkActive"
     [class]="rlaRh.isActive ? 'flex flex-1 flex-col items-center justify-center gap-0.5 py-2 rounded-t-lg bg-[#E8F5F0] text-[#022F11]' : 'flex flex-1 flex-col items-center justify-center gap-0.5 py-2 text-gray-500'">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
    </svg>
    <span class="text-[10px] font-semibold leading-tight">History</span>
  </a>
</nav>
