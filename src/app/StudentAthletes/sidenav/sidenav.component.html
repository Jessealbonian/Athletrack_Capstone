<!-- Desktop sidebar -->
<aside [class.w-64]="isNavOpen"
       [class.w-20]="!isNavOpen"
       class="hidden lg:flex fixed top-14 left-0 h-[calc(100vh-3.5rem)] border-r bg-white transform translate-x-0
              transition-all duration-300 ease-in-out z-50 flex-col">
  
  <button 
    (click)="toggleNav()"
    [class.left-56]="isNavOpen"
    [class.left-16]="!isNavOpen"
    class="absolute top-4 p-3 rounded-lg hover:bg-indigo-300 bg-white shadow-md transition-all duration-300">
    <svg *ngIf="isNavOpen" xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
    </svg>
    <svg *ngIf="!isNavOpen" xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
    </svg>
  </button>

  <nav class="space-y-1 p-4 mt-4">
    <a routerLink="/dashboard" [routerLinkActive]="['bg-indigo-200', 'text-gray-900']" class="flex items-center gap-3 rounded-lg px-3 py-2 text-gray-500 hover:bg-indigo-200 hover:text-gray-900">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-9 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM4 13a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H5a1 1 0 01-1-1v-6zM16 13a1 1 0 011-1h2a1 1 0 011 1v6a1 1 0 01-1 1h-2a1 1 0 01-1-1v-6z" />
      </svg>
      <span [class.hidden]="!isNavOpen">Dashboard</span>
    </a>

    <a routerLink="/Routines" [routerLinkActive]="['bg-indigo-200', 'text-gray-900']" class="flex items-center gap-3 rounded-lg px-3 py-2 text-gray-500 hover:bg-indigo-200 hover:text-gray-900">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-9 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
      </svg>
      <span [class.hidden]="!isNavOpen">Routines</span>
    </a>

    <a routerLink="/profile" [routerLinkActive]="['bg-indigo-200', 'text-gray-900']" class="flex items-center gap-3 rounded-lg px-3 py-2 text-gray-500 hover:bg-indigo-200 hover:text-gray-900">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-9 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" />
      </svg>
      <span [class.hidden]="!isNavOpen">Profile</span>
    </a>
  </nav>
</aside>

<!-- Mobile bottom navigation -->
<nav class="lg:hidden fixed bottom-0 left-0 right-0 z-50 border-t border-indigo-100 bg-white shadow-[0_-4px_14px_rgba(67,56,202,0.12)] flex justify-around items-stretch pt-1 pb-[max(0.5rem,env(safe-area-inset-bottom))] px-1">
  <a routerLink="/dashboard"
     routerLinkActive
     #rlaDash="routerLinkActive"
     [routerLinkActiveOptions]="{ exact: false }"
     [class]="rlaDash.isActive ? 'flex flex-1 flex-col items-center justify-center gap-0.5 py-2 rounded-t-lg bg-indigo-100 text-indigo-900' : 'flex flex-1 flex-col items-center justify-center gap-0.5 py-2 text-gray-500'">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM4 13a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H5a1 1 0 01-1-1v-6zM16 13a1 1 0 011-1h2a1 1 0 011 1v6a1 1 0 01-1 1h-2a1 1 0 01-1-1v-6z" />
    </svg>
    <span class="text-[10px] font-semibold leading-tight">Dashboard</span>
  </a>
  <a routerLink="/Routines"
     routerLinkActive
     #rlaRoutines="routerLinkActive"
     [class]="rlaRoutines.isActive ? 'flex flex-1 flex-col items-center justify-center gap-0.5 py-2 rounded-t-lg bg-indigo-100 text-indigo-900' : 'flex flex-1 flex-col items-center justify-center gap-0.5 py-2 text-gray-500'">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
    </svg>
    <span class="text-[10px] font-semibold leading-tight">Routines</span>
  </a>
  <a routerLink="/profile"
     routerLinkActive
     #rlaProfile="routerLinkActive"
     [class]="rlaProfile.isActive ? 'flex flex-1 flex-col items-center justify-center gap-0.5 py-2 rounded-t-lg bg-indigo-100 text-indigo-900' : 'flex flex-1 flex-col items-center justify-center gap-0.5 py-2 text-gray-500'">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" />
    </svg>
    <span class="text-[10px] font-semibold leading-tight">Profile</span>
  </a>
</nav>
